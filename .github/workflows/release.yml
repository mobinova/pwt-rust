name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml, without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pwt-rust-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io and GitHub
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Protocol Buffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default stable

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid semantic version: $RELEASE_VERSION"
            exit 1
          fi

          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Cargo.toml version ($PACKAGE_VERSION) does not match release version ($RELEASE_VERSION)."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists."
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify package
        run: cargo publish --dry-run --locked

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            --latest
